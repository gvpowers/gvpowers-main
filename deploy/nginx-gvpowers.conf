# Nginx reverse proxy for gvpowers.in (serves the Flask app via Gunicorn).
# Install to: /etc/nginx/sites-available/gvpowers.in
# Enable with: ln -s /etc/nginx/sites-available/gvpowers.in /etc/nginx/sites-enabled/
# The catalogue subdomain (catalog.gvpowers.in) is a separate application —
# DO NOT point it at this config.

server {
    listen 80;
    listen [::]:80;
    server_name gvpowers.in www.gvpowers.in;

    # When running behind a Cloudflare Tunnel, keep this server bound to
    # 127.0.0.1:8000 (Gunicorn) — see README "Cloudflare Tunnel" section.

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/xml;
    gzip_min_length 1024;

    location /static/ {
        alias /var/www/gvpowers-corporate-website/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # Security headers (Cloudflare adds HTTPS/HSTS at the edge)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
